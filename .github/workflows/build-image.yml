name: Build PHP Image

on:
  push:
    branches: ["main"]
    paths:
      - "php/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/php" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use --name mybuilder --driver docker-container

      - name: Build and push by digest
        id: build
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true" \
            --cache-from "type=gha,scope=build-linux-amd64" \
            --cache-to "type=gha,mode=max,scope=build-linux-amd64" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file /tmp/metadata.json \
            ./php
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/metadata.json)" >> $GITHUB_OUTPUT

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/php" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use --name mybuilder --driver docker-container

      - name: Build and push by digest
        id: build
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true" \
            --cache-from "type=gha,scope=build-linux-arm64" \
            --cache-to "type=gha,mode=max,scope=build-linux-arm64" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file /tmp/metadata.json \
            ./php
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/metadata.json)" >> $GITHUB_OUTPUT

  merge:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/php" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use --name mybuilder --driver docker-container

      - name: Create manifest list and push
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "${IMAGE}:sha-${SHORT_SHA}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}@${{ needs.build-amd64.outputs.digest }}" \
            "${IMAGE}@${{ needs.build-arm64.outputs.digest }}"

      - name: Inspect image
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}"
