services:
  nginx:
    image: nginx:1.29-trixie
    depends_on:
      - php
      - db
    ports:
      - "80:80"
    security_opt:
      - label=disable
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lamp

  php:
    image: ${PHP_IMAGE:-ghcr.io/eluvrion/lamp-dev/php:latest}
    depends_on:
      - db
    security_opt:
      - label=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./www:/var/www/html:rw
      - ./php/conf.d/app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
      - ./php/php-fpm.d/zz-www-tuning.conf:/usr/local/etc/php-fpm.d/zz-www-tuning.conf:ro
    networks:
      - lamp

  db:
    image: mariadb:lts
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: school
      TZ: Europe/Rome
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - lamp

volumes:
  mariadb_data:

networks:
  lamp:
